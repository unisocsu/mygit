name: Build Java Project ☕

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code 📂
      uses: actions/checkout@v4

    - name: Set up JDK 17 ☕
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java files ⚙️
      run: javac -encoding UTF-8 *.java