name: Build Java Project & Create JAR ☕

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code 📂
      uses: actions/checkout@v4

    - name: Set up JDK 17 ☕
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java files ⚙️
      run: javac -encoding UTF-8 *.java

    - name: Create JAR package 📦
      run: jar cfe mygit.jar mygitauth *.class

    - name: Upload JAR Artifact 🚀
      uses: actions/upload-artifact@v4
      with:
        name: mygit-executable
        path: mygit.jar